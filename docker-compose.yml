services:
  api:
    build:
      context: .
      dockerfile: ClaimCheck.API/Dockerfile
    env_file:
      - .env.api
    ports:
      - "5278:8080"
    depends_on:
      db:
        condition: service_healthy
  
  web:
    build:
      context: .
      dockerfile: ClaimCheck.Web/Dockerfile
    ports:
      - "5138:80"

  db:
    image: postgres:17
    container_name: claimcheck-db
    env_file:
      - .env.api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - claimcheck-db-data:/var/lib/postgresql/data

volumes:
  claimcheck-db-data:
